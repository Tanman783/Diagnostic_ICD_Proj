RandomForest:
  default:
    n_estimators: 150
    max_depth: 10
    min_samples_split: 5
    class_weight:
      0: 1
      1: 1
  grid_search:
    n_estimators: [100, 200]
    max_depth: [6, 10, 14]
    min_samples_split: [5, 10]
    class_weight:
      - {0: 1, 1: 1}
      - {0: 1, 1: 5}

XGBoost:
  default:
    learning_rate: 0.1
    max_depth: 5
    n_estimators: 200
    scale_pos_weight: 2
    objective: binary:logistic
    eval_metric: logloss
  grid_search:
    learning_rate: [0.01, 0.05, 0.1]
    max_depth: [4, 6, 10]
    n_estimators: [100, 200]
    scale_pos_weight: [1, 5]
    objective: [binary:logistic]

CatBoost:
  default:
    learning_rate: 0.1
    depth: 6
    n_estimators: 300
  grid_search:
    learning_rate: [0.03, 0.1]
    depth: [4, 6, 8]
    n_estimators: [200, 300]